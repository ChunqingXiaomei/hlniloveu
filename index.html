<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>侯琳娜，我爱你</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.88em' font-size='86'%3E%F0%9F%92%97%3C/text%3E%3C/svg%3E">
<style>
  *, *::before, *::after { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    background: #07020a;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", -apple-system, sans-serif;
    -webkit-tap-highlight-color: transparent;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    cursor: crosshair;
  }

  #bg {
    position: fixed; inset: 0; z-index: 0;
    background:
      radial-gradient(ellipse 85% 65% at 50% 42%, #34102b 0%, #1b0717 36%, #0c030c 68%, #050107 100%);
  }
  #bg::after {
    content: "";
    position: absolute; inset: 0;
    background: radial-gradient(circle at 50% 45%, rgba(255,45,111,0.16) 0%, rgba(255,45,111,0) 58%);
    animation: breathe 7.5s ease-in-out infinite;
    will-change: opacity, transform;
  }
  @keyframes breathe {
    0%, 100% { opacity: .45; transform: scale(1); }
    50%      { opacity: 1;   transform: scale(1.14); }
  }

  #c {
    position: fixed; inset: 0; z-index: 1;
    display: block;
    width: 100%; height: 100%;
    transform-origin: 50% 50%;
    animation: heartbeat 1.15s ease-in-out infinite;
    will-change: transform;
  }
  /* 双跳心跳，让整块画面跟着脉搏走 */
  @keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    9%       { transform: scale(1.016); }
    18%      { transform: scale(1.003); }
    27%      { transform: scale(1.010); }
    42%      { transform: scale(1); }
  }

  /* ---------- 开场 ---------- */
  #intro {
    position: fixed; inset: 0; z-index: 2;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    pointer-events: none;
    animation: introOut 0.8s cubic-bezier(.4,0,.2,1) 1.15s forwards;
  }
  #intro .name {
    font-size: clamp(54px, 17vw, 168px);
    font-weight: 800;
    line-height: 1;
    letter-spacing: .05em;
    text-indent: .05em;
    color: #ffffff;
    text-shadow:
      0 0 26px rgba(255,90,148,.95),
      0 0 64px rgba(255,45,111,.8),
      0 0 130px rgba(255,45,111,.5);
    animation:
      nameIn 1s cubic-bezier(.16,.9,.2,1) both,
      nameGlow 2.6s ease-in-out 1s infinite;
    will-change: transform, opacity, filter;
  }
  #intro .sub {
    margin-top: clamp(10px, 2.4vh, 26px);
    font-size: clamp(15px, 4.6vw, 32px);
    font-weight: 500;
    letter-spacing: .62em;
    text-indent: .62em;
    color: #ffb9cd;
    text-shadow: 0 0 22px rgba(255,95,143,.95), 0 0 48px rgba(255,45,111,.5);
    animation: subIn .95s cubic-bezier(.16,.9,.2,1) .42s both;
    will-change: transform, opacity;
  }
  @keyframes nameIn {
    from { opacity: 0; transform: scale(.7); filter: blur(16px); }
    to   { opacity: 1; transform: scale(1);  filter: blur(0); }
  }
  @keyframes nameGlow {
    0%, 100% {
      text-shadow:
        0 0 26px rgba(255,90,148,.9),
        0 0 64px rgba(255,45,111,.75),
        0 0 130px rgba(255,45,111,.45);
    }
    50% {
      text-shadow:
        0 0 38px rgba(255,130,175,1),
        0 0 96px rgba(255,45,111,.95),
        0 0 180px rgba(255,45,111,.62);
    }
  }
  @keyframes subIn {
    from { opacity: 0; transform: translateY(16px); letter-spacing: 1.1em; }
    to   { opacity: 1; transform: translateY(0); letter-spacing: .62em; }
  }
  @keyframes introOut {
    to { opacity: 0; transform: scale(1.32); filter: blur(12px); }
  }

  /* ---------- 提示 ---------- */
  #hint {
    position: fixed;
    left: 0; right: 0;
    bottom: calc(18px + env(safe-area-inset-bottom, 0px));
    z-index: 3;
    text-align: center;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: .5em;
    text-indent: .5em;
    color: rgba(255,175,205,.55);
    pointer-events: none;
    animation: hintIn 1.2s ease 2.2s both, hintPulse 3.4s ease-in-out 2.2s infinite;
  }
  @keyframes hintIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes hintPulse {
    0%, 100% { opacity: .28; }
    50%      { opacity: .8; }
  }

  @media (prefers-reduced-motion: reduce) {
    #bg::after, #hint { animation: none; }
  }
</style>
</head>
<body>
<div id="bg"></div>
<canvas id="c"></canvas>
<div id="intro">
  <div class="name">侯琳娜</div>
  <div class="sub">我爱你</div>
</div>
<div id="hint">轻触屏幕</div>

<script>
(function () {
  'use strict';

  var cv  = document.getElementById('c');
  var ctx = cv.getContext('2d');

  var SENTENCE = '侯琳娜我爱你';
  var FONT = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif';
  var PALETTE = ['#ff5f8f', '#ff8fb1', '#ffc2d8', '#ffffff', '#ff9ec4', '#ffd6e5', '#ffb3c8'];
  var HEART_COLORS = ['#ff5f8f', '#ff8fb1', '#ff2d6f', '#ffc2d8', '#ffd6e5', '#ffffff'];

  var W = 0, H = 0, DPR = 1, CX = 0, CY = 0, MAXD = 1;
  var words = [], bigs = [], hearts = [], rings = [];
  var elapsed = 0, startTime = 0, lastTime = 0, spawnAcc = 0;
  var introEl = document.getElementById('intro');
  var ptr = { x: -9999, y: -9999, on: false };
  var ringAcc = 0;

  function rand(a, b) { return a + Math.random() * (b - a); }
  function pick(arr) { return arr[(Math.random() * arr.length) | 0]; }
  function easeOutCubic(p) { return 1 - Math.pow(1 - p, 3); }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

  /* ---------------- 布局 ---------------- */

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    cv.width  = Math.round(W * DPR);
    cv.height = Math.round(H * DPR);
    cv.style.width  = W + 'px';
    cv.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    build();
  }

  function build() {
    words.length = 0;
    bigs.length = 0;
    CX = W / 2;
    CY = H / 2;
    MAXD = Math.hypot(CX, CY) || 1;

    var shortSide = Math.min(W, H);

    /* 背景巨型文字——只作极淡的底纹 */
    var bigCount = W < 620 ? 2 : 3;
    for (var i = 0; i < bigCount; i++) {
      bigs.push({
        x: rand(0.1, 0.9) * W,
        y: rand(0.1, 0.9) * H,
        size: rand(0.4, 0.72) * shortSide,
        rot: rand(-0.75, 0.75),
        alpha: rand(0.018, 0.038),
        phase: rand(0, 6.2832),
        speed: rand(0.15, 0.34)
      });
    }

    /* 前景铺满的文字网格 */
    var fs = W < 520 ? 15 : (W < 900 ? 17.5 : 20);
    var textW = fs * SENTENCE.length * 1.04;
    var cellW = textW * 1.42;
    var cellH = fs * 2.78;

    /* 网格从屏幕外沿铺起，保证四边都不留空 */
    for (var gy = -cellH * 0.5; gy < H + cellH * 1.0; gy += cellH) {
      for (var gx = -cellW * 0.5; gx < W + cellW * 1.0; gx += cellW) {
        var x = gx + rand(-0.44, 0.44) * cellW;
        var y = gy + rand(-0.44, 0.44) * cellH;
        var d = Math.hypot(x - CX, y - CY);
        var scale = rand(0.78, 1.3);
        var a0 = rand(0.42, 0.92);
        if (scale > 1.14) a0 *= 0.94;

        words.push({
          x: x,
          y: y,
          size: fs * scale,
          rot: rand(-0.38, 0.38),
          color: pick(PALETTE),
          blur: Math.random() < 0.24 ? rand(8, 15) : 0,
          a0: a0,
          phase: rand(0, 6.2832),
          speed: rand(0.5, 1.15),
          swayX: rand(3, 15),
          swayY: rand(3, 11),
          swayS: rand(0.35, 0.72),
          floatAmp: rand(10, 32),
          floatSpeed: rand(0.5, 1.15),
          waveAmp: rand(7, 24),
          wavePhase: rand(-0.7, 0.7),
          spark: 0,
          sparkDecay: 1.6,
          delay: elapsed + 0.78 + (d / MAXD) * 0.68 + rand(0, 0.14),
          fromX: CX + rand(-1, 1) * 46,
          fromY: CY + rand(-1, 1) * 46,
          ox: 0,
          oy: 0
        });
      }
    }
  }

  /* ---------------- 绘制 ---------------- */

  function drawBig(w, t) {
    var a = w.alpha * (0.62 + 0.38 * Math.sin(t * w.speed + w.phase));
    if (a <= 0.002) return;
    ctx.save();
    ctx.globalAlpha = a;
    ctx.translate(w.x + Math.sin(t * 0.11 + w.phase) * 22, w.y + Math.cos(t * 0.09 + w.phase) * 16);
    ctx.rotate(w.rot + Math.sin(t * 0.07 + w.phase) * 0.05);
    ctx.font = '800 ' + w.size.toFixed(0) + 'px ' + FONT;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#ff6fa0';
    ctx.fillText(SENTENCE, 0, 0);
    ctx.restore();
  }

  function drawWord(w, t, dt) {
    var el = t - w.delay;
    if (el <= 0) return;

    var p = clamp(el / 0.72, 0, 1);
    var e = easeOutCubic(p);

    /* 横向行波 + 各自的上下浮动 */
    var wave = Math.sin(t * 1.32 + w.x * 0.0055 + w.wavePhase) * w.waveAmp;
    var floatY = Math.sin(t * w.floatSpeed + w.phase * 1.3) * w.floatAmp;
    var dx = Math.sin(t * w.swayS + w.phase) * w.swayX;
    var dy = Math.cos(t * w.swayS * 0.87 + w.phase) * w.swayY;

    var x = w.fromX + (w.x - w.fromX) * e + dx + w.ox;
    var y = w.fromY + (w.y - w.fromY) * e + wave + dy + floatY + w.oy;

    /* 亮度 = 个体呼吸 × 自下而上扫过的光带 + 随机高光 */
    var breath = 0.74 + 0.26 * Math.sin(t * w.speed + w.phase * 1.7);
    var band = 0.7 + 0.5 * (0.5 + 0.5 * Math.sin(w.y * 0.0115 - t * 1.5));
    var a = w.a0 * e * breath * band + w.spark * 0.42;
    if (a > 1) a = 1;
    if (a <= 0.004) return;

    var hot = w.spark > 0.35;
    var rot = w.rot + Math.sin(t * w.swayS * 0.6 + w.phase) * 0.075 + (1 - e) * 0.55;
    var sc = 0.62 + 0.38 * e + w.spark * 0.1;

    ctx.save();
    ctx.globalAlpha = a;
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.scale(sc, sc);
    ctx.font = '600 ' + w.size.toFixed(1) + 'px ' + FONT;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    if (hot) {
      ctx.fillStyle = '#ffffff';
      ctx.shadowColor = '#ffffff';
      ctx.shadowBlur = 26 * w.spark;
    } else {
      ctx.fillStyle = w.color;
      if (w.blur) {
        ctx.shadowColor = w.color;
        ctx.shadowBlur = w.blur * e;
      }
    }
    ctx.fillText(SENTENCE, 0, 0);
    ctx.restore();
  }

  function heartPath(s) {
    ctx.beginPath();
    ctx.moveTo(0, 0.32 * s);
    ctx.bezierCurveTo(-0.12 * s, 0.16 * s, -0.5 * s, 0, -0.5 * s, -0.26 * s);
    ctx.bezierCurveTo(-0.5 * s, -0.58 * s, -0.13 * s, -0.7 * s, 0, -0.43 * s);
    ctx.bezierCurveTo(0.13 * s, -0.7 * s, 0.5 * s, -0.58 * s, 0.5 * s, -0.26 * s);
    ctx.bezierCurveTo(0.5 * s, 0, 0.12 * s, 0.16 * s, 0, 0.32 * s);
    ctx.closePath();
  }

  function drawHearts() {
    for (var i = 0; i < hearts.length; i++) {
      var h = hearts[i];
      ctx.save();
      ctx.globalAlpha = h.alpha > 1 ? 1 : h.alpha;
      ctx.translate(h.x, h.y);
      ctx.rotate(h.rot);
      ctx.fillStyle = h.color;
      heartPath(h.size);
      ctx.fill();
      ctx.restore();
    }
  }

  function drawRings() {
    for (var i = 0; i < rings.length; i++) {
      var g = rings[i];
      ctx.save();
      ctx.globalAlpha = g.alpha > 1 ? 1 : g.alpha;
      ctx.strokeStyle = g.color || '#ff7fa8';
      ctx.lineWidth = Math.max(0.6, (g.lw || 5) * (1 - g.p * 0.6));
      ctx.beginPath();
      ctx.arc(g.x, g.y, g.r, 0, 6.2832);
      ctx.stroke();
      ctx.restore();
    }
  }

  /* ---------------- 更新 ---------------- */

  function updateHearts(dt, t) {
    for (var i = hearts.length - 1; i >= 0; i--) {
      var h = hearts[i];
      if (h.sw) h.x += Math.sin(t * h.sw + h.ph) * 16 * dt;
      h.x += h.vx * dt;
      h.y += h.vy * dt;
      h.vy += h.g * dt;
      if (h.drag) {
        var k = 1 - h.drag * dt;
        if (k < 0) k = 0;
        h.vx *= k;
        h.vy *= k;
      }
      h.rot += h.vr * dt;
      if (h.fade) h.alpha -= h.fade * dt;
      if (h.alpha <= 0.012 || h.y < -90 || h.y > H + 140 || h.x < -140 || h.x > W + 140) {
        hearts.splice(i, 1);
      }
    }

    for (var j = rings.length - 1; j >= 0; j--) {
      var g = rings[j];
      g.p += dt * (g.ps || 1.5);
      g.r += (g.max - g.r) * Math.min(1, dt * 5);
      g.alpha -= dt * (g.fade || 0.85);
      if (g.alpha <= 0.01 || g.p >= 1) rings.splice(j, 1);
    }

    /* 环境漂浮爱心 */
    spawnAcc += dt;
    if (spawnAcc > 0.42 && hearts.length < 78) {
      spawnAcc = 0;
      hearts.push({
        x: rand(-10, W + 10),
        y: H + rand(20, 90),
        vx: rand(-14, 14),
        vy: rand(-62, -26),
        g: rand(-5, 5),
        drag: 0,
        vr: rand(-0.55, 0.55),
        rot: rand(-0.5, 0.5),
        size: rand(7, 20),
        alpha: rand(0.22, 0.58),
        color: pick(HEART_COLORS),
        sw: rand(0.45, 1.35),
        ph: rand(0, 6.2832),
        fade: 0
      });
    }
  }

  /* ---------------- 交互 ---------------- */

  function burst(px, py) {
    var n = 26;
    for (var i = 0; i < n; i++) {
      var ang = rand(0, 6.2832);
      var sp = rand(90, 470);
      hearts.push({
        x: px,
        y: py,
        vx: Math.cos(ang) * sp,
        vy: Math.sin(ang) * sp - 40,
        g: 300,
        drag: 1.5,
        vr: rand(-4.5, 4.5),
        rot: rand(-0.6, 0.6),
        size: rand(9, 26),
        alpha: 1,
        color: pick(HEART_COLORS),
        fade: rand(0.5, 0.95)
      });
    }

    rings.push({ x: px, y: py, r: 6, max: rand(110, 190), alpha: 0.75, p: 0 });

    /* 把周围的文字推开，再弹回 */
    var R = 300;
    for (var j = 0; j < words.length; j++) {
      var w = words[j];
      var dx = w.x - px;
      var dy = w.y - py;
      var d = Math.hypot(dx, dy);
      if (d < R && d > 0.5) {
        var f = 1 - d / R;
        var push = f * f * 88;
        w.ox += (dx / d) * push;
        w.oy += (dy / d) * push;
      }
    }
  }

  window.addEventListener('pointerdown', function (e) {
    burst(e.clientX, e.clientY);
  }, { passive: true });

  window.addEventListener('pointermove', function (e) {
    ptr.x = e.clientX;
    ptr.y = e.clientY;
    ptr.on = true;
  }, { passive: true });

  window.addEventListener('pointerleave', function () {
    ptr.on = false;
  }, { passive: true });

  var rzTimer = null;
  window.addEventListener('resize', function () {
    if (rzTimer) clearTimeout(rzTimer);
    rzTimer = setTimeout(resize, 180);
  });

  /* ---------------- 主循环 ---------------- */

  function loop(now) {
    if (!startTime) {
      startTime = now;
      lastTime = now;
    }
    elapsed = (now - startTime) / 1000;

    var dt = (now - lastTime) / 1000;
    lastTime = now;
    if (!isFinite(dt) || dt <= 0) dt = 0.016;
    if (dt > 0.05) dt = 0.05;

    ctx.clearRect(0, 0, W, H);

    ctx.globalCompositeOperation = 'lighter';

    /* 缓慢扫过画面的柔光 */
    var lx = ((elapsed * 95) % (W + 760)) - 380;
    var ly = H * 0.5 + Math.sin(elapsed * 0.55) * H * 0.32;
    var lg = ctx.createRadialGradient(lx, ly, 0, lx, ly, Math.min(W, H) * 0.66);
    lg.addColorStop(0, 'rgba(255,85,142,0.15)');
    lg.addColorStop(0.45, 'rgba(255,60,120,0.05)');
    lg.addColorStop(1, 'rgba(255,60,120,0)');
    ctx.fillStyle = lg;
    ctx.fillRect(0, 0, W, H);

    var i;
    for (i = 0; i < bigs.length; i++) drawBig(bigs[i], elapsed);

    /* 文字：回弹 + 随机高光 + 指针推开 */
    var recover = Math.pow(0.13, dt);
    for (i = 0; i < words.length; i++) {
      var w = words[i];

      if (w.ox !== 0 || w.oy !== 0) {
        w.ox *= recover;
        w.oy *= recover;
        if (Math.abs(w.ox) < 0.05) w.ox = 0;
        if (Math.abs(w.oy) < 0.05) w.oy = 0;
      }

      if (ptr.on) {
        var pdx = w.x - ptr.x;
        var pdy = w.y - ptr.y;
        var pd = Math.sqrt(pdx * pdx + pdy * pdy);
        if (pd < 250 && pd > 1) {
          var pf = 1 - pd / 250;
          w.ox += (pdx / pd) * pf * pf * 430 * dt;
          w.oy += (pdy / pd) * pf * pf * 430 * dt;
        }
      }

      if (w.spark > 0) {
        w.spark -= dt * w.sparkDecay;
        if (w.spark < 0) w.spark = 0;
      }
      if (Math.random() < 0.0009) {
        w.spark = 1;
        w.sparkDecay = rand(1.1, 2.2);
      }

      drawWord(w, elapsed, dt);
    }

    /* 从中心规律扩散的心跳涟漪 */
    ringAcc += dt;
    if (ringAcc > 3.2) {
      ringAcc = 0;
      rings.push({
        x: CX, y: CY, r: 24,
        max: Math.max(W, H) * 0.62,
        alpha: 0.3, p: 0, lw: 2.2, ps: 0.55, fade: 0.28,
        color: '#ff4d88'
      });
    }

    updateHearts(dt, elapsed);
    drawHearts();
    drawRings();

    ctx.globalCompositeOperation = 'source-over';

    requestAnimationFrame(loop);
  }

  /* ---------------- 启动 ---------------- */

  if (introEl) {
    introEl.addEventListener('animationend', function (e) {
      if (e.animationName === 'introOut') {
        if (introEl && introEl.parentNode) introEl.parentNode.removeChild(introEl);
        introEl = null;
      }
    });
  }

  resize();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
